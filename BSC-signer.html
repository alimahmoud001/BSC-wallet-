<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>BSC Signer - توقيع المعاملات</title>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs2@0.0.2/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        *{box-sizing: border-box;} body{background:#000; color:#eee; font-family:sans-serif; padding:20px;} .container{max-width:550px;margin:auto;background:#0a0a0a;border-radius:32px;padding:24px;} h1{color:#FBBF24;text-align:center;} .card{background:#141414;border-radius:24px;padding:18px;margin-bottom:20px;} input,textarea,button{width:100%;margin:8px 0; padding:12px;border-radius:40px;border:none;} input,textarea{background:#1e1e1e;color:white;} button{background:#FBBF24;color:black;font-weight:bold;cursor:pointer;} .qr-box{background:white;padding:10px;display:inline-block;margin:10px auto; border-radius:20px;} .flex{display:flex;gap:12px;} .address{word-break:break-all;background:#1e1e1e;padding:10px;border-radius:20px;}
    </style>
</head>
<body>
<div class="container">
    <h1>✍️ أداة توقيع BSC</h1>
    <div class="card">
        <input type="text" id="signerPrivateKey" placeholder="المفتاح الخاص (0x...)" />
        <button id="loadSignerBtn">🔓 تحميل المحفظة</button>
        <div id="signerAddressArea" style="margin-top:10px; font-size:14px;"></div>
    </div>
    <div class="card">
        <label>📄 المعاملة غير الموقعة (RAW)</label>
        <textarea id="unsignedForSign" rows="3" placeholder="الصق المعاملة غير الموقعة من المحفظة الرئيسية"></textarea>
        <button id="scanUnsignedQrBtn">📷 تصوير QR للمعاملة</button>
        <button id="signTransactionBtn">🔏 توقيع المعاملة</button>
        <div id="signedResultArea" style="display:none; margin-top:20px;">
            <label>✅ التوقيع / المعاملة الموقعة (rawTransaction)</label>
            <textarea id="signedRawTx" rows="3" readonly></textarea>
            <div id="signedQrCode" class="qr-box"></div>
            <button id="copySignedTxBtn">📋 نسخ التوقيع</button>
        </div>
    </div>
</div>
<script>
    const web3 = new Web3();
    let signerAccount = null;

    document.getElementById("loadSignerBtn").onclick = () => {
        let pk = document.getElementById("signerPrivateKey").value.trim();
        if(!pk.startsWith("0x")) pk = "0x"+pk;
        try{
            signerAccount = web3.eth.accounts.privateKeyToAccount(pk);
            document.getElementById("signerAddressArea").innerHTML = `العنوان: ${signerAccount.address}`;
        } catch(e){ alert("مفتاح خاص خاطئ"); }
    };
    // تصوير QR للمعاملة الغير موقعة
    document.getElementById("scanUnsignedQrBtn").onclick = () => {
        Html5Qrcode.getCameras().then(devices => {
            if(devices && devices.length){
                let scanner = new Html5Qrcode("unsignedForSign");
                scanner.start(devices[0].id, { fps: 10, qrbox: 250 }, (decoded) => {
                    document.getElementById("unsignedForSign").value = decoded;
                    scanner.stop();
                    alert("تم قراءة المعاملة");
                }).catch(e=>alert(e));
            } else alert("لا توجد كاميرا");
        });
    };
    // توقيع المعاملة
    document.getElementById("signTransactionBtn").onclick = async () => {
        if(!signerAccount) { alert("قم بتحميل المفتاح الخاص أولاً"); return; }
        let rawUnsigned = document.getElementById("unsignedForSign").value.trim();
        if(!rawUnsigned) { alert("لا توجد معاملة"); return; }
        try{
            let txObj = JSON.parse(web3.utils.hexToAscii(rawUnsigned).replace(/\\/g, "")); // قد يكون الترميز بسيطاً
            if(!txObj.gas) txObj.gas = 210000;
            let signedTx = await web3.eth.accounts.signTransaction(txObj, signerAccount.privateKey);
            let signedRaw = signedTx.rawTransaction;
            document.getElementById("signedRawTx").value = signedRaw;
            document.getElementById("signedResultArea").style.display = "block";
            document.getElementById("signedQrCode").innerHTML = "";
            new QRCode(document.getElementById("signedQrCode"), { text: signedRaw, width: 180, height: 180 });
        } catch(err){
            alert("خطأ في التوقيع: قد يكون نص المعاملة غير صالح. تأكد من نسخ النص من المحفظة الرئيسية بشكل صحيح.\n"+err);
        }
    };
    document.getElementById("copySignedTxBtn").onclick = () => {
        let val = document.getElementById("signedRawTx").value;
        if(val) { navigator.clipboard.writeText(val); alert("تم نسخ التوقيع"); }
    };
</script>
</body>
</html>
